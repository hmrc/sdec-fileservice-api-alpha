info:
  name: Upload file with reference
  type: http
  seq: 5

http:
  method: POST
  url: "{{BASE_URL}}/thread/{{THREAD_REFERENCE}}/file"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - files/test-256k.pdf
        contentType: application/pdf

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

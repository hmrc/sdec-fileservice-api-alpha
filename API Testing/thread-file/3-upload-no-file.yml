info:
  name: Upload No File
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/thread/{{THREAD_REFERENCE}}/file"
  body:
    type: multipart-form
    data:
      - name: file
        type: text
        value: ""

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.body.errorCode
      operator: eq
      value: MISSING_FILE
    - expression: res.body.message
      operator: contains
      value: "'file'"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

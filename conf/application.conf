include "backend.conf"

appName = sdec-fileservice-api-alpha

play.modules.enabled += "uk.gov.hmrc.play.bootstrap.HttpClientV2Module"

play.modules.enabled += "uk.gov.hmrc.sdecfileserviceapialpha.Module"

play.i18n.langs = ["en"]

play.http.router = prod.Routes

microservice {
  services {
    auth {
      host = localhost
      port = 8500
    }
  }
}

timeout-dialog {
  timeout   = 900
  countdown = 120
}

s3 {
    endpoint = "http://localhost:8333"
    region = "us-east-1"
    bucket = "sdec-uploads"
    accessKey = "admin"
    secretKey = "secret"
}

